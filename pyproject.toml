[project]
name = "chole-demo"
version = "0.0.0"
description = "The live demo: a client of chole-eval's served model"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "websockets",
    "pyyaml",
    "starlette",
    "uvicorn",
    "playwright",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["chole_demo"]
