<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CholeVLM live demo</title>
  </head>
  <body class="view-presenter">
    <!-- the virtual operating room: WebGL behind, the monitors' pages in CSS3D over it -->
    <div id="stage" data-anchor="room">
      <canvas id="room"></canvas>
      <div id="css3d"></div>
    </div>

    <header id="topbar">
      <div class="brand">CholeVLM <span>live demo</span></div>
      <div id="feed-info">loading…</div>
      <div id="conn" role="status" hidden></div>
      <div id="mock-banner" hidden></div>
      <div id="tabs">
        <div id="view-switch" role="group" aria-label="view">
          <button type="button" data-view="presenter" aria-pressed="true">Presenter</button>
          <button type="button" data-view="engineer" aria-pressed="false" title="the engineer's monitor: raw replies, every delay figure and the prior (key E)">Engineer</button>
        </div>
        <!-- the owner's sign-in: a password, no user name -->
        <button type="button" id="owner-tab" aria-expanded="false" aria-controls="owner-panel" title="the owner's sign-in">
          <svg class="i-lock" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7.25" width="10" height="7" /><path d="M5.25 7.25V5.5a2.75 2.75 0 0 1 5.5 0v1.75" /></svg>
          <svg class="i-unlock" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7.25" width="10" height="7" /><path d="M5.25 7.25V5.5a2.75 2.75 0 0 1 5.4-.7" /></svg>
          <span>Owner</span>
        </button>
        <span id="owner-status" class="sr-only" role="status" aria-live="polite"></span>
      </div>
    </header>
    <section id="owner-panel" role="dialog" aria-labelledby="owner-title" aria-describedby="owner-note" hidden>
      <h2 id="owner-title">Owner sign-in</h2>
      <p id="owner-note">Signing in turns on Ask and the videos not shown publicly.</p>
      <form id="owner-form">
        <div class="pw">
          <label for="owner-input" class="sr-only">Owner password</label>
          <input id="owner-input" type="password" autocomplete="current-password" placeholder="Owner password" />
          <button type="submit" id="owner-submit">Sign in</button>
        </div>
        <p id="owner-msg" role="status" aria-live="polite"></p>
      </form>
      <div class="acts">
        <button type="button" id="owner-out" hidden>Sign out</button>
        <button type="button" id="owner-close">Close</button>
      </div>
    </section>
    <section id="ask-panel" hidden aria-live="polite">
      <div id="ask-log"></div>
      <button type="button" id="ask-close">Close</button>
    </section>

    <section id="hud">
      <div id="controls" data-anchor="controls">
        <button id="play" type="button" aria-label="play" title="play / pause (space)">
          <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" /></svg>
          <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z" /></svg>
        </button>
        <span id="clock">00:00</span>
        <label><span class="sr-only">run</span><select id="run" title="run"></select></label>
        <label><span class="sr-only">speed</span>
          <select id="speed" title="playback speed">
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
        </label>
        <label id="live-sim-label" title="Offline runs: show each decision when live would have it, after its compute time, with the ticks live would drop skipped">
          <input type="checkbox" id="live-sim" /> live delay
        </label>
        <!-- the owner's alone: shown once he is signed in through the Owner tab -->
        <form id="ask-form" data-anchor="ask" hidden>
          <label for="ask-input" class="sr-only">Ask the model</label>
          <input id="ask-input" autocomplete="off" placeholder="Ask the model…" title="for example: describe the scene" />
          <button type="submit">Ask</button>
        </form>
      </div>
      <div id="timeline" data-anchor="timeline" tabindex="0" role="slider" aria-label="video time" aria-valuemin="0" title="the model's own phase timeline (running memory); click, or arrow keys, to seek"></div>
      <div id="recent"></div>
      <div id="events" data-anchor="events" aria-live="polite"></div>
    </section>
    <footer id="attribution" hidden></footer>
    <footer id="held-out" hidden></footer>
    <footer id="synthetic-label" hidden>
      synthetic robotic footage generated by NVIDIA Cosmos3-H-Dreams, out of the model's
      training distribution, no clinical claim
    </footer>
    <!-- phones and narrow or short windows: the model's reading as a dashboard under the
         room, and play, the clock and the timeline in a bar at the foot (main.js) -->
    <!-- phones: the tools as monitor B shows them, a card above the room, so the
         tools, the room and the rest follow top to bottom with no scrolling -->
    <div id="tool-card" class="screen tools" aria-label="Tools in view and the next tool"></div>
    <section id="flat" aria-label="The model's reading"></section>
    <div id="bar" role="group" aria-label="Playback"></div>

    <!-- the pages the room lays on its screens -->
    <div id="pages">
      <div id="screen-b" class="screen" data-anchor="readings">
        <div class="b-top"><div id="b-rail" class="rail"></div><div id="b-stamp" class="late"></div></div>
        <!-- two columns on monitor C, each in its own flow (on a phone, tiles: display
             contents): what holds now on the left (where it is, safety, the model's words),
             what is ahead on the right, as the tools page parts now from next (the
             reading a navigation aid); the 30-second next
             step is on the engineer's page -->
        <div class="b-col">
          <div class="lane" id="lane-now">
            <div id="lane-phase" data-anchor="phase"></div>
            <div id="lane-tools" data-anchor="tools"></div>
          </div>
          <div class="lane" id="lane-safety">
            <div id="lane-cvs" data-anchor="cvs"></div>
            <div id="lane-flags" data-anchor="flags"></div>
          </div>
          <div class="lane presenter-only" id="lane-why" data-anchor="why"></div>
        </div>
        <div class="b-col">
          <div class="lane" id="lane-ahead" data-anchor="ahead"></div>
        </div>
      </div>
      <!-- monitor B in the presenter view: the tools in view now and the next one -->
      <div id="screen-tools" class="screen tools" data-anchor="tools-page"></div>
      <div id="screen-c" class="screen" data-anchor="engineer">
        <div class="c-head">Engineer · the decision log as it arrives</div>
        <div id="c-model" class="c-model" data-anchor="model"></div>
        <div class="c-cols">
          <div id="reply" data-anchor="reply"></div>
          <div class="c-right">
            <div id="delay" data-anchor="delay"></div>
            <div id="c-step" data-anchor="step"></div>
            <div id="c-calls" data-anchor="calls"></div>
            <div id="c-cvs" data-anchor="cvs-served"></div>
          </div>
        </div>
      </div>
      <figure id="model-frame">
        <img id="model-frame-img" alt="the frame the decision on screen was made from" />
        <figcaption id="model-frame-note">model saw –</figcaption>
      </figure>
    </div>

    <video id="video" muted playsinline preload="auto" aria-label="the procedure video, shown on the endoscope monitor"></video>
    <img id="frame" alt="" hidden />
    <canvas id="fx"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
